# Netlify deployment configuration for StrikersFeed (Next.js App Router).
# The official Next.js runtime plugin handles SSR, image optimisation and routing.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Apple requires the AASA file served as application/json (it has no extension).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
